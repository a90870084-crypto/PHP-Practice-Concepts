<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Banking Account and Transaction Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
       
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 10%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .radio-group, .checkbox-group {
            margin-top: 5px;
        }
        .radio-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }
        .btn-container {
            text-align: center;
            margin-top: 20px;
        }
        button, input[type="submit"], input[type="reset"] {
            background-color: #d49306;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        input[type="reset"] {
            background-color: #6c757d;
        }
        button:hover, input[type="submit"]:hover {
            background-color: #0056b3;
        }
        input[type="reset"]:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Banking Account Form</h2>
    <form action="process.php" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="fullName">Customer Full Name:</label>
            <input type="text" id="fullName" name="fullName">
        </div>

        <div class="form-group">
            <label for="accountNumber">Account Number:</label>
            <input type="text" id="accountNumber" name="accountNumber">
        </div>
        <div class="form-group">
            <label>Gender:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>
        </div>
        <div class="form-group">
            <label for="accountType">Account Type:</label>
            <select id="accountType" name="accountType">
                <option value="">--Select Account Type--</option>
                <option value="Savings">Savings</option>
                <option value="Current">Current</option>
                <option value="Business">Business</option>
            </select>
        </div>

        <div class="form-group">
            <label for="openingBalance">Opening Balance ($):</label>
            <input type="number" id="openingBalance" name="openingBalance" step="any">
        </div>

        <div class="form-group">
            <label>Transaction Type:</label>
            <div class="radio-group">
                <label><input type="radio" name="transactionType" value="Deposit"> Deposit</label>
                <label><input type="radio" name="transactionType" value="Withdrawal"> Withdrawal</label>
            </div>
        </div>

        <div class="form-group">
            <label for="transactionAmount">Transaction Amount ($):</label>
            <input type="number" id="transactionAmount" name="transactionAmount" step="any">
        </div>

        <div class="form-group">
            <label for="accountDuration">Account Duration (Years):</label>
            <input type="number" id="accountDuration" name="accountDuration">
        </div>

        <div class="form-group">
            <label for="idDocument">Identification Document:</label>
            <input type="file" id="idDocument" name="idDocument">
        </div>

        <div class="btn-container">
            <input type="submit" name="submitBtn" value="Process Transaction">
            <input type="reset" value="Reset">
        </div>

    </form>
</div>

</body>
</html>
