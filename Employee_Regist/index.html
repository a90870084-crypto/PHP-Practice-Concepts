<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration and Document Upload System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"], select, input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .radio-group { display: flex; gap: 15px; align-items: center; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button, input[type="reset"] { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button[type="submit"] { background-color: #28a745; color: white; flex: 1; }
        button[type="submit"]:hover { background-color: #218838; }
        input[type="reset"] { background-color: #dc3545; color: white; flex: 1; }
        input[type="reset"]:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee Registration System</h2>
    <!-- Requirements: POST method, enctype for file upload, action points to process.php -->
    <form action="process.php" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="fullName">Employee Full Name:</label>
            <input type="text" id="fullName" name="fullName">
        </div>

        <div class="form-group">
            <label for="employeeId">Employee ID:</label>
            <input type="text" id="employeeId" name="employeeId">
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
        </div>

        <div class="form-group">
            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="">--Select Department--</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Finance">Finance</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Administration">Administration</option>
            </select>
        </div>

        <div class="form-group">
            <label for="basicSalary">Basic Salary:</label>
            <input type="number" step="0.01" id="basicSalary" name="basicSalary">
        </div>

        <div class="form-group">
            <label for="allowance">Allowance:</label>
            <input type="number" step="0.01" id="allowance" name="allowance">
        </div>

        <div class="form-group">
            <label for="deduction">Deduction:</label>
            <input type="number" step="0.01" id="deduction" name="deduction">
        </div>

        <div class="form-group">
            <label for="employeeDoc">Employee Document:</label>
            <input type="file" id="employeeDoc" name="employeeDoc">
        </div>

        <div class="btn-group">
            <button type="submit" name="register">Register and Calculate</button>
            <input type="reset" value="Reset">
        </div>

    </form>
</div>

</body>
</html>
